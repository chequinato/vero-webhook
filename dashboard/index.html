<!doctype html>
<html lang="pt-BR" data-mode="paper">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VERO — Boletim de Integridade Transacional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Em Mac/iPhone a pilha resolve para a São Francisco do próprio sistema.
      Fora do ecossistema Apple, Geist e Geist Mono seguram a mesma métrica
      humanista-neogrotesca; Newsreader continua servindo as notas editoriais.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..900&family=Geist+Mono:wght@300..600&family=Newsreader:ital,opsz,wght@1,6..72,300..500&display=swap" rel="stylesheet">
    <script>
      // Aplica o modo antes da primeira pintura para não piscar.
      try {
        var m = localStorage.getItem('vero.mode');
        if (m) document.documentElement.dataset.mode = m;
      } catch (e) { /* storage bloqueado */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
